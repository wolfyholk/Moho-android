name: Build Moho Clone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Qt Desktop (Host Tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'linux'
          target: 'desktop'
          dir: '${{ github.workspace }}/qt-host'
          aqtversion: '==3.3.*'
          py7zrversion: '==1.1.0'

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: '${{ github.workspace }}/qt-android'
          aqtversion: '==3.3.*'
          py7zrversion: '==1.1.0'

      - name: Configure and Build APK
        run: |
          export HOST_QT_PATH="${{ github.workspace }}/qt-host/Qt/6.8.2/gcc_64"
          export ANDROID_QT_PATH="${{ github.workspace }}/qt-android/Qt/6.8.2/android_arm64_v8a"

          $ANDROID_QT_PATH/bin/qt-cmake -B build -S . \
            -DQT_HOST_PATH=$HOST_QT_PATH \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
            
          cmake --build build --target apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MohoClone-Android-APK
          path: build/android-build/build/outputs/apk/debug/*.apk
