name: Build Moho Clone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Qt Desktop (Host Tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'linux'
          target: 'desktop'
          aqtversion: '==3.3.*'
          py7zrversion: '==1.1.0'

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          aqtversion: '==3.3.*'
          py7zrversion: '==1.1.0'

      - name: Configure and Build APK
        run: |
          export HOST_QT_PATH="$GITHUB_WORKSPACE/Qt/6.8.2/gcc_64"
          export ANDROID_QT_PATH="$GITHUB_WORKSPACE/android/Qt/6.8.2/android_arm64_v8a"
          
          if [ ! -d "$HOST_QT_PATH" ]; then
            export HOST_QT_PATH=$(find $GITHUB_WORKSPACE -maxdepth 4 -name "gcc_64" | head -n 1)
          fi
          if [ ! -d "$ANDROID_QT_PATH" ]; then
            export ANDROID_QT_PATH=$(find $GITHUB_WORKSPACE -maxdepth 5 -name "android_arm64_v8a" | head -n 1)
          fi

          echo "Host Qt: $HOST_QT_PATH"
          echo "Android Qt: $ANDROID_QT_PATH"

          $ANDROID_QT_PATH/bin/qt-cmake -B build -S . \
            -DQT_HOST_PATH=$HOST_QT_PATH \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
            
          cmake --build build --target apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MohoClone-Android-APK
          path: build/android-build/build/outputs/apk/debug/*.apk
